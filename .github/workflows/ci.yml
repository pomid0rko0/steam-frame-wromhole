# On every push to a branch: the builds and every test, in the tests' environment (image.yml: its
# amd64 image; the arm64 one, for the Frame's tools/box.sh, is made beside it), shared out over
# twelve machines that end at about the same time: the builds, then a share of the stereo test; the
# OpenXR test alone (as tools/test_openxr.sh needs); the Godot tests, then a share; the headset's
# compiler, then a share; the shaders' accuracy in three, alone (ref/test_gpu.py's pieces take all of
# a machine's cores): the bodies' meshes in the zone (its check zone, two pieces a throat), the tail
# (its check tail, two pieces a throat) and the rest with the gravity's; five more machines of the stereo test alone, the longest
# curved places' traces each on one of them (tools/stereo_parts.txt: the shares, PART=n). A branch that
# differs from main only in Markdown (*.md) and docs/ gets none of them, as no check reads those
# («Что изменилось», changes); main, a version, a tag and a release always get them all.
# The builds (tools/export.sh: the headset's, its one-eye check's, the PC's for Windows and Linux)
# are the run's files at once, named as export.sh names them (tools/deploy_frame.ps1 takes the
# headset's); they are deleted from the run unless the stereo test passes on the same commit (the
# hard rule in CLAUDE.md): a run stopped by a newer push deletes them too, and a rerun of the stereo
# test alone does not bring them back ("Re-run all jobs" does). «Все проверки» (all) is the run's
# verdict, the one check main's ruleset requires.
# A version: the owner's button (Actions > CI > Run workflow on main, "исправление" or "новое": the
# newest version tag's last or middle number up by one), or a version tag, or a release published
# with GitHub's form (its tag comes with it: one run takes both). The same, then, once every job
# here has passed, the release: notes generated from the titles of the PRs merged since the last
# version (unless the form has some), the headset's build as wormhole_vr.arm64 and as its zip, and
# the PC's zips.
name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Выпустить версию (только на main): исправление — последняя цифра +1, новое — средняя +1'
        type: choice
        options: [нет, исправление, новое]
        default: нет
# a newer push stops the older run (a version's run, only another version's)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version == 'исправление' || inputs.version == 'новое' }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
jobs:
  # full: whether the run builds and checks (above). The branch's own changes are those since it
  # left main, renames as the old path and the new one (a file moved into docs/ left its old place).
  changes:
    name: Что изменилось
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.diff.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          full=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" != main ]; then
            files=$(git -c core.quotePath=false diff --no-renames --name-only "$(git merge-base origin/main HEAD)" HEAD)
            echo "since main:"; echo "$files"
            grep -q -v -E '\.md$|^docs/|^$' <<<"$files" || full=false
          fi
          [ $full = true ] || echo "only Markdown and docs/ differ from main: nothing to build or check" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  image:
    name: Образ окружения (amd64)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      arch: amd64

  image-arm64:
    name: Образ окружения для Фрейма (arm64)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      arch: arm64

  build:
    name: Сборки для шлема и ПК, стерео-тест 1
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      frame: ${{ steps.export.outputs.frame }}
      windows: ${{ steps.export.outputs.windows }}
      linux: ${{ steps.export.outputs.linux }}
      stereo: ${{ steps.stereo.outcome }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # each build (export.sh's flags), its zip (the newest) as the step's output of that name
      - id: export
        run: |
          for b in frame "frame_check --check" "windows --pc-windows" "windows_check --check --pc-windows" \
              "linux --pc-linux" "linux_check --check --pc-linux"; do
            set -- $b
            tools/export.sh "${@:2}" "$GITHUB_REF_NAME"
            echo "$1=$(basename "$(ls -t godot/build/*.zip | head -1)")" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.export.outputs.frame }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.export.outputs.frame_check }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.export.outputs.windows }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.export.outputs.windows_check }}
          archive: false
      # the tests run the project's files: what the export leaves out only an exported build shows.
      # The PC's Linux ones, this machine's, on the desktop (software Vulkan): each starts, prints
      # its commit (main.gd) and runs 300 frames without a script or shader error
      - name: The PC's Linux builds run
        run: |
          for z in "${{ steps.export.outputs.linux }}" "${{ steps.export.outputs.linux_check }}"; do
            d=$(mktemp -d)
            unzip -q "godot/build/$z" -d "$d"
            echo "$z:"
            XDG_DATA_HOME=$d timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
              "$d/wormhole_vr.x86_64" --xr-mode off --quit-after 300 > "$d/log" 2>&1 || { tail -20 "$d/log"; exit 1; }
            grep "^build: " "$d/log"
            if grep -E "SCRIPT ERROR|SHADER ERROR" -A3 "$d/log"; then exit 1; fi
          done
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.export.outputs.linux }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.export.outputs.linux_check }}
          archive: false
      - id: stereo
        if: ${{ !cancelled() }}
        run: PART=1 OUT="$PWD/stereo" tools/test_stereo.sh
      - if: ${{ !cancelled() && steps.stereo.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: stereo-images-1
          path: stereo/

  stereo:
    name: Стерео-тест ${{ matrix.part }}
    needs: image
    strategy:
      fail-fast: false
      matrix:
        part: [4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: PART=${{ matrix.part }} OUT="$PWD/stereo" tools/test_stereo.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stereo-images-${{ matrix.part }}
          path: stereo/

  # the builds go unless every share of the stereo test passed (above); with no builds made, nothing
  unsafe:
    name: Удаление сборок, если стерео-тест не прошёл
    needs: [build, tests, adreno, stereo]
    if: >-
      always() && needs.build.result != 'skipped' && (needs.stereo.result != 'success'
      || needs.build.outputs.stereo != 'success' || needs.tests.outputs.stereo != 'success'
      || needs.adreno.outputs.stereo != 'success')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("wormhole_vr_")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "deleted $name"
          done

  # main through the real OpenXR path, alone on its machine (its frames are judged against Monado's
  # display)
  openxr:
    name: Приложение через OpenXR
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: tools/test_openxr.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openxr-logs
          path: .wt/.out/
          include-hidden-files: true

  tests:
    name: Тесты в Godot, стерео-тест 2
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      stereo: ${{ steps.stereo.outcome }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: tests
        run: OUT="$PWD/test-logs" tools/test.sh
      - if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: test-logs/
      - id: stereo
        if: ${{ !cancelled() }}
        run: PART=2 OUT="$PWD/stereo" tools/test_stereo.sh
      - if: ${{ !cancelled() && steps.stereo.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: stereo-images-2
          path: stereo/

  # what the headset's shader compiler makes of the shaders goes into the job's summary; it fails on
  # a shader the compiler refuses
  adreno:
    name: Компилятор шлема, стерео-тест 3
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      stereo: ${{ steps.stereo.outcome }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          for a in "" --paths --fov; do
            echo "### tools/adreno_stats.sh $a"
            echo '```'
            tools/adreno_stats.sh $a
            echo '```'
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - id: stereo
        if: ${{ !cancelled() }}
        run: PART=3 OUT="$PWD/stereo" tools/test_stereo.sh
      - if: ${{ !cancelled() && steps.stereo.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: stereo-images-3
          path: stereo/

  # ref/test_gpu.py in three: its check zone (the bodies' meshes in the zone) on a machine of its own,
  # its check tail on another, all the others (-zone -tail) with the gravity's on a third
  ref-zone:
    name: Точность шейдеров, сетки тел в зоне
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 ref/test_gpu.py zone

  ref-tail:
    name: Точность шейдеров, хвост тел в зоне
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 ref/test_gpu.py tail

  ref:
    name: Точность шейдеров и гравитации
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 ref/test_gpu.py -zone -tail
      - if: ${{ !cancelled() }}
        run: python3 ref/test_gravity.py

  # the version the button asks for: its tag, from the newest one, at once (the release makes it)
  version:
    name: Номер версии
    if: github.event_name == 'workflow_dispatch' && inputs.version != 'нет'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "a version comes only from main, not $GITHUB_REF_NAME"; exit 1; }
          tags=$(gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" \
            --jq '.[] | "\(.ref | ltrimstr("refs/tags/")) \(.object.sha)"')
          if grep " $GITHUB_SHA$" <<<"$tags"; then echo "main's commit has a version already"; exit 1; fi
          last=$(cut -d' ' -f1 <<<"$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          IFS=. read -r major minor patch <<<"${last:-v0.0.0}"
          major=${major#v}
          case $KIND in
            исправление) tag=v$major.$minor.$((patch + 1)) ;;
            новое) tag=v$major.$((minor + 1)).0 ;;
          esac
          echo "${last:-none} → $tag" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # on every push that builds the builds are gathered as for a release; published only for a version
  release:
    name: Релиз (публикация — только для версии)
    needs: [changes, build, openxr, tests, adreno, ref-zone, ref-tail, ref, stereo, version]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wormhole_vr_*
          path: dl
          skip-decompress: true
      - env:
          FRAME: ${{ needs.build.outputs.frame }}
          WINDOWS: ${{ needs.build.outputs.windows }}
          LINUX: ${{ needs.build.outputs.linux }}
        run: |
          mkdir out
          for z in "$FRAME" "$WINDOWS" "$LINUX"; do
            f=$(find dl -type f -name "$z" | head -1)
            [ -n "$f" ] || { echo "no $z among:"; find dl; exit 1; }
            cp "$f" out/
          done
          unzip -o "out/$FRAME" wormhole_vr.arm64 -d out
          ls -la out
      - if: needs.version.outputs.tag != '' || github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW: ${{ needs.version.outputs.tag }}
        run: |
          if [ -n "$NEW" ]; then
            gh release create "$NEW" --target "$GITHUB_SHA" --generate-notes --title "$NEW" out/*
          else
            tag=$GITHUB_REF_NAME
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes --title "$tag"
            gh release upload "$tag" out/* --clobber
          fi

  # the run's verdict: changes passed, and every job above but unsafe and version passed, or, where
  # changes found nothing to check, was skipped. A required check that is skipped counts on GitHub
  # as passed, and every test is skipped when its image fails, so main's ruleset requires this one
  # alone; here skipped is passed only by changes' word, cancelled never (this job runs even in a
  # cancelled run).
  all:
    name: Все проверки
    needs: [changes, image, image-arm64, build, openxr, tests, adreno, ref-zone, ref-tail, ref, stereo, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          [ "$(jq -r '.changes.outputs.full' <<<"$NEEDS")" = false ] && ok='["success", "skipped"]' || ok='["success"]'
          bad=$(jq -r --argjson ok "$ok" 'to_entries[]
            | select(if .key == "changes" then .value.result != "success" else (.value.result | IN($ok[])) | not end)
            | "\(.key): \(.value.result)"' <<<"$NEEDS")
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
          [ "$ok" = '["success"]' ] && echo "every check passed" || echo "nothing to check: only Markdown and docs/ differ from main"
