# On every push to a branch: the builds and every test, each test on a machine of its own (the
# OpenXR test then runs alone, as tools/test_openxr.sh needs), in the tests' environment (image.yml:
# its amd64 image; the arm64 one, for the Frame's tools/box.sh, is made beside it).
# The builds (tools/export.sh: the headset's, its one-eye check's, the PC's for Windows and Linux)
# are the run's files at once, named as export.sh names them (tools/deploy_frame.ps1 takes the
# headset's); they are deleted from the run unless the stereo test passes on the same commit (the
# hard rule in CLAUDE.md): a run stopped by a newer push deletes them too, and a rerun of the stereo
# test alone does not bring them back ("Re-run all jobs" does).
# On a version tag, or a release published on GitHub (its tag comes with it: one run takes both),
# the same, then the release: notes generated from the merged PRs' titles if GitHub's form made
# none, the headset's build as wormhole_vr.arm64 and as its zip, and the PC's zips, once every job
# here has passed.
name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: read
defaults:
  run:
    shell: bash
jobs:
  image:
    name: Образ окружения (amd64)
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      arch: amd64

  image-arm64:
    name: Образ окружения для Фрейма (arm64)
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      arch: arm64

  build:
    name: Сборки для шлема и ПК
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      frame: ${{ steps.frame.outputs.zip }}
      windows: ${{ steps.windows.outputs.zip }}
      linux: ${{ steps.linux.outputs.zip }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: frame
        run: |
          tools/export.sh "$GITHUB_REF_NAME"
          echo "zip=$(basename godot/build/wormhole_vr_*_steam_frame.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.frame.outputs.zip }}
          archive: false
      - id: check
        run: |
          tools/export.sh --check "$GITHUB_REF_NAME"
          echo "zip=$(basename godot/build/wormhole_vr_*_check_*_steam_frame.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.check.outputs.zip }}
          archive: false
      - id: windows
        run: |
          tools/export.sh --pc-windows "$GITHUB_REF_NAME"
          echo "zip=$(basename godot/build/wormhole_vr_*_pc_windows.zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.windows.outputs.zip }}
          archive: false
      - id: linux
        run: |
          tools/export.sh --pc-linux "$GITHUB_REF_NAME"
          echo "zip=$(basename godot/build/wormhole_vr_*_pc_linux.zip)" >> "$GITHUB_OUTPUT"
      # the tests run the project's files: what the export leaves out only an exported build shows.
      # The PC's Linux one, this machine's, on the desktop (software Vulkan): it starts, prints its
      # commit (main.gd) and runs 300 frames without a script or shader error
      - name: The PC's Linux build runs
        run: |
          d=$(mktemp -d)
          XDG_DATA_HOME=$d timeout 300 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot/build/wormhole_vr.x86_64 --xr-mode off --quit-after 300 > "$d/log" 2>&1 || { tail -20 "$d/log"; exit 1; }
          grep "^build: " "$d/log"
          ! grep -E "SCRIPT ERROR|SHADER ERROR" -A3 "$d/log"
      - uses: actions/upload-artifact@v7
        with:
          path: godot/build/${{ steps.linux.outputs.zip }}
          archive: false

  stereo:
    name: Стерео-тест
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: OUT="$PWD/stereo" tools/test_stereo.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stereo-images
          path: stereo/

  # the builds go unless the stereo test passed (above)
  unsafe:
    name: Удаление сборок, если стерео-тест не прошёл
    needs: [build, stereo]
    if: always() && needs.stereo.result != 'success'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("wormhole_vr_")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "deleted $name"
          done

  tests:
    name: Тесты в Godot
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: OUT="$PWD/test-logs" tools/test.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: test-logs/

  openxr:
    name: Приложение через OpenXR
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: tools/test_openxr.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: openxr-logs
          path: .wt/.out/
          include-hidden-files: true

  ref:
    name: Точность шейдеров и гравитации
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 ref/test_gpu.py
      - if: ${{ !cancelled() }}
        run: python3 ref/test_gravity.py

  # what the headset's shader compiler makes of the shaders, in the job's summary; it fails on a
  # shader the compiler refuses
  adreno:
    name: Компилятор шлема
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          for a in "" --paths --fov; do
            echo "### tools/adreno_stats.sh $a"
            echo '```'
            tools/adreno_stats.sh $a
            echo '```'
          done | tee -a "$GITHUB_STEP_SUMMARY"

  # on every push the builds are gathered as for a release; published only for a version
  release:
    name: Релиз (публикация — только для версии)
    needs: [build, stereo, tests, openxr, ref, adreno]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wormhole_vr_*
          path: dl
          skip-decompress: true
      - env:
          FRAME: ${{ needs.build.outputs.frame }}
          WINDOWS: ${{ needs.build.outputs.windows }}
          LINUX: ${{ needs.build.outputs.linux }}
        run: |
          mkdir out
          for z in "$FRAME" "$WINDOWS" "$LINUX"; do
            f=$(find dl -type f -name "$z" | head -1)
            [ -n "$f" ] || { echo "no $z among:"; find dl; exit 1; }
            cp "$f" out/
          done
          unzip -o "out/$FRAME" wormhole_vr.arm64 -d out
          ls -la out
      - if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" out/* --clobber
