<title>Червоточина Морриса–Торна</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the ray-traced view fills the screen; one translucent control sheet docks at the bottom. */
:root {
  --ink: #e8ecf3;
  --muted: #9ba5b8;
  --sheet: rgba(13, 16, 24, 0.74);
  --line: rgba(232, 236, 243, 0.14);
  --throat: #5ff0dc;          /* the cyan throat circle painted on the floor */
  --track: rgba(232, 236, 243, 0.22);
  --font-ui: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: #0b0d13;
  color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  overflow: hidden;
  touch-action: none;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#view:active { cursor: grabbing; }

.readout {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 2px;
  padding: 8px 12px;
  background: var(--sheet);
  border: 1px solid var(--line);
  border-radius: 10px;
  font: 500 13px/1.35 var(--font-num);
  font-variant-numeric: tabular-nums;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.readout .where { color: var(--throat); }
.readout .orbit { color: var(--muted); font-weight: 400; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-block: 14px calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sheet);
  border-top: 1px solid var(--line);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.sheet-inner { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
.hint { margin: 0; color: var(--muted); font-size: 12.5px; max-width: 62ch; }
.row { display: grid; grid-template-columns: 7.5em 1fr 4.8em; align-items: center; gap: 10px; }
.row label { color: var(--muted); font-size: 12.5px; }
.row output { font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, select {
  font: 500 13px var(--font-ui);
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 12px;
  min-height: 34px;
}
button.primary { border-color: var(--throat); color: var(--throat); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--throat); outline-offset: 2px; }
.controls .spacer { flex: 1; }
.controls label { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--track); border-radius: 2px; }
input[type=range]::-moz-range-track { height: 3px; background: var(--track); border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7.5px; border-radius: 50%; background: var(--ink); border: 3px solid #0b0d13; box-shadow: 0 0 0 1px var(--throat); }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--ink); border: 3px solid #0b0d13; box-shadow: 0 0 0 1px var(--throat); }

[hidden] { display: none !important; }
.err { position: fixed; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: var(--ink); text-align: center; }

@media (max-width: 480px) {
  .row { grid-template-columns: 6.2em 1fr 4.4em; }
  .hint { display: none; }
}
</style>

<canvas id="view" aria-label="Вид изнутри пространства с червоточиной"></canvas>

<div class="readout" aria-live="polite">
  <span class="where" id="where">l = +10.73 м · вселенная A</span>
  <span class="orbit" id="orbit">горло 8.0 м · скругление 1.0 м</span>
  <span class="orbit" id="bench" hidden></span>
</div>

<div class="sheet">
  <div class="sheet-inner">
    <div class="head">
      <h1>Червоточина Морриса–Торна</h1>
      <p class="hint">Каждый пиксель — луч света по геодезической. Тяните по картинке, чтобы осмотреться.</p>
    </div>
    <div class="row">
      <label for="walk">Пройдено</label>
      <input id="walk" type="range" min="0" max="26" step="0.01" value="0">
      <output id="walkOut" for="walk">0.0 м</output>
    </div>
    <div class="row">
      <label for="offset">Смещение</label>
      <input id="offset" type="range" min="-5" max="5" step="0.05" value="0">
      <output id="offsetOut" for="offset">0.00 м</output>
    </div>
    <div class="row">
      <label for="hlen">Длина горла</label>
      <input id="hlen" type="range" min="0.05" max="12" step="0.05" value="5">
      <output id="hlenOut" for="hlen">5.00 м</output>
    </div>
    <div class="row">
      <label for="fil">Скругление</label>
      <input id="fil" type="range" min="0.05" max="2.5" step="0.05" value="1">
      <output id="filOut" for="fil">1.00 м</output>
    </div>
    <div class="controls">
      <button id="play" class="primary" type="button">Идти</button>
      <button id="reset" type="button">В начало</button>
      <button id="benchBtn" type="button">Замер скорости</button>
      <span class="spacer"></span>
      <label for="quality">Чёткость
        <select id="quality">
          <option value="0.5">50%</option>
          <option value="0.75" selected>75%</option>
          <option value="1">100%</option>
        </select>
      </label>
    </div>
  </div>
</div>

<div class="err" id="err" hidden></div>

<script id="frag" type="x-shader/x-fragment">#version 300 es
precision highp float;
precision highp int;
uniform float wh_rho0;
uniform float wh_h;
uniform float wh_fillet;
uniform vec4 wh_sph[6];
uniform vec4 wh_pil[4];
uniform vec4 wh_box[4];
uniform vec4 wh_ball[12];
uniform vec4 wh_ballCol[12];
uniform int wh_nBall;
uniform float uL0;
uniform vec3 uN0;
uniform vec4 uF;
uniform vec4 uRt;
uniform vec4 uUp;
uniform vec2 uTan;
uniform vec2 uSize;
out vec4 frag;
/*CORE*/
void main() {
    vec2 ndc = gl_FragCoord.xy / uSize * 2.0 - 1.0;
    vec3 dl = normalize(vec3(ndc.x * uTan.x, ndc.y * uTan.y, 1.0));
    vec4 V = dl.x * uRt + dl.y * uUp + dl.z * uF;
    vec4 dbg;
    vec3 col = wh_render(uL0, uN0, V.x, V.yzw, dbg);
    frag = vec4(pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2)), 1.0);
}
</script>

<script>
(() => {
  // ---------------------------------------------------------------- geometry (same as the VR app)
  // optozorax's SDF world at 1 unit = 10 m: throat (sphere) radius 3 m, planes at w = +-h, fillet radius F
  const RHO0 = 3.0, HEAD = 1.6, START_X = 10.0, STEP = 0.02;
  const G = {};
  function setProfile(h, F) {
    G.h = h; G.F = F; G.Lc = Math.max(h - F, 0); G.th0 = Math.asin(Math.max(1 - h / F, 0));
    G.L = G.Lc + F * (Math.PI / 2 - G.th0); G.Rout = RHO0 + F;
  }
  const theta = al => G.th0 + (Math.min(Math.max(al, G.Lc), G.L) - G.Lc) / G.F;
  const r = l => { const al = Math.abs(l); return al >= G.L ? al - G.L + G.Rout : RHO0 + G.F * (1 - Math.cos(theta(al))); };
  const dr = l => { const al = Math.abs(l); return Math.sign(l) * (al >= G.L ? 1 : Math.sin(theta(al))); };
  const wz = l => { const al = Math.abs(l); return Math.sign(l) * (al >= G.L ? G.h : al <= G.Lc ? al : G.h - G.F + G.F * Math.sin(theta(al))); };
  const SCENE = /*SCENE*/;
  setProfile(5.0, 1.0);
  const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm3 = a => { const s = Math.hypot(a[0], a[1], a[2]); return [a[0] / s, a[1] / s, a[2] / s]; };
  const add4 = (a, b, h) => [a[0] + h * b[0], a[1] + h * b[1], a[2] + h * b[2], a[3] + h * b[3]];
  const scale4 = (a, s) => [a[0] * s, a[1] * s, a[2] * s, a[3] * s];
  const dot4 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];

  // tangent vectors are [U_l, ux, uy, uz]; vecs[0] is the velocity, the rest are transported
  function deriv(l, n, vecs) {
    const rr = r(l), k = dr(l) / rr, v = vecs[0], w = [v[1], v[2], v[3]];
    const dv = vecs.map(U => {
      const uw = U[1] * w[0] + U[2] * w[1] + U[3] * w[2];
      return [k * uw, -k * U[0] * w[0] - uw / rr * n[0], -k * U[0] * w[1] - uw / rr * n[1], -k * U[0] * w[2] - uw / rr * n[2]];
    });
    return [v[0], [w[0] / rr, w[1] / rr, w[2] / rr], dv];
  }
  function tangent(n, U) { const u = [U[1], U[2], U[3]], d = dot3(u, n); return [U[0], u[0] - d * n[0], u[1] - d * n[1], u[2] - d * n[2]]; }
  function geodesic(l, n, dir, dist, frame) {
    let vecs = [dir, ...frame];
    const steps = Math.max(1, Math.ceil(dist / STEP)), h = dist / steps;
    const shift = (d, s) => [l + s * d[0], [n[0] + s * d[1][0], n[1] + s * d[1][1], n[2] + s * d[1][2]], vecs.map((U, i) => add4(U, d[2][i], s))];
    for (let s = 0; s < steps; s++) {
      const k1 = deriv(l, n, vecs);
      let y = shift(k1, h / 2); const k2 = deriv(y[0], y[1], y[2]);
      y = shift(k2, h / 2); const k3 = deriv(y[0], y[1], y[2]);
      y = shift(k3, h); const k4 = deriv(y[0], y[1], y[2]);
      l += h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
      n = norm3([0, 1, 2].map(j => n[j] + h / 6 * (k1[1][j] + 2 * k2[1][j] + 2 * k3[1][j] + k4[1][j])));
      vecs = vecs.map((U, i) => tangent(n, [0, 1, 2, 3].map(j => U[j] + h / 6 * (k1[2][i][j] + 2 * k2[2][i][j] + 2 * k3[2][i][j] + k4[2][i][j]))));
    }
    return [l, n, vecs.slice(1)];
  }
  function fromChartA(n, d) { const rad = dot3(d, n); return [rad, d[0] - rad * n[0], d[1] - rad * n[1], d[2] - rad * n[2]]; }
  function orthonormalize([ex, ey, ez]) {
    ey = scale4(ey, 1 / Math.sqrt(dot4(ey, ey)));
    ez = add4(ez, ey, -dot4(ez, ey)); ez = scale4(ez, 1 / Math.sqrt(dot4(ez, ez)));
    ex = add4(add4(ex, ey, -dot4(ex, ey)), ez, -dot4(ex, ez)); ex = scale4(ex, 1 / Math.sqrt(dot4(ex, ex)));
    return [ex, ey, ez];
  }

  // Feet start in universe A at (10, offset, 0) facing -x, walk `dist` straight ahead along the floor.
  // Returns the eye's manifold point and the play-space axes transported to it.
  function eyeState(dist, offset) {
    const x = [START_X, offset, 0], rr = Math.hypot(x[0], x[1]);
    let l = rr - G.Rout + G.L, n = [x[0] / rr, x[1] / rr, 0];
    let frame = [fromChartA(n, [0, 1, 0]), [0, 0, 0, 1], fromChartA(n, [1, 0, 0])];   // right, up, back
    if (dist > 0) {
      const res = geodesic(l, n, scale4(frame[2], -1), dist, frame);
      l = res[0]; n = norm3([res[1][0], res[1][1], 0]);
      const fx = tangent(n, [res[2][0][0], res[2][0][1], res[2][0][2], 0]);
      const fz = tangent(n, [res[2][2][0], res[2][2][1], res[2][2][2], 0]);
      frame = orthonormalize([fx, [0, 0, 0, 1], fz]);
    }
    const foot = { l, n };
    const head = geodesic(l, n, frame[1], HEAD, frame);
    return { foot, l: head[0], n: head[1], frame: head[2] };
  }

  // ---------------------------------------------------------------- GL
  const canvas = document.getElementById('view');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: false });
  const fail = msg => { const e = document.getElementById('err'); e.textContent = msg; e.hidden = false; };
  if (!gl) { fail('Нужен браузер с WebGL 2.'); return; }
  const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, '#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}'));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { fail('Шейдер не собрался: ' + e.message); return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = name => gl.getUniformLocation(prog, name);
  const v4 = rows => new Float32Array(rows.flat());
  gl.uniform4fv(U('wh_sph'), v4(SCENE.spheres_A.concat(SCENE.spheres_B)));
  gl.uniform4fv(U('wh_pil'), v4(SCENE.pillars_A));
  gl.uniform4fv(U('wh_box'), v4(SCENE.boxes_B));
  // the VR app's starting balls, resting on the floor in universe A
  const BALLS = [[7, -1.5, 0.25, [0.92, 0.25, 0.2]], [7, 0, 0.25, [0.2, 0.6, 0.95]], [7, 1.5, 0.25, [0.98, 0.8, 0.2]],
                 [6, -0.75, 0.35, [0.3, 0.85, 0.4]], [6, 0.75, 0.35, [0.75, 0.35, 0.9]]];
  function uploadGeometry() {
    gl.uniform1f(U('wh_rho0'), RHO0); gl.uniform1f(U('wh_h'), G.h); gl.uniform1f(U('wh_fillet'), G.F);
    const pos = [], col = [];
    for (const [bx, by, rad, c] of BALLS) { pos.push(bx, by, rad, G.h); col.push(c[0], c[1], c[2], rad); }
    while (pos.length < 48) { pos.push(0, 0, 0, 0); col.push(0, 0, 0, 0); }
    gl.uniform4fv(U('wh_ball'), new Float32Array(pos)); gl.uniform4fv(U('wh_ballCol'), new Float32Array(col));
    gl.uniform1i(U('wh_nBall'), BALLS.length);
  }
  uploadGeometry();

  // ---------------------------------------------------------------- state & UI
  const walk = document.getElementById('walk'), offset = document.getElementById('offset');
  const walkOut = document.getElementById('walkOut'), offsetOut = document.getElementById('offsetOut');
  const where = document.getElementById('where'), orbit = document.getElementById('orbit');
  const hlen = document.getElementById('hlen'), fil = document.getElementById('fil');
  const hlenOut = document.getElementById('hlenOut'), filOut = document.getElementById('filOut');
  const bench = document.getElementById('bench'), benchBtn = document.getElementById('benchBtn');
  const play = document.getElementById('play'), quality = document.getElementById('quality');
  let yaw = 0, pitch = -0.05, playing = false, last = 0, dirty = true, state = null;

  function updateState() {
    setProfile(+hlen.value, +fil.value);
    uploadGeometry();
    walk.max = (START_X - G.Rout + 2 * G.L + 8).toFixed(2);
    state = eyeState(+walk.value, +offset.value);
    const fl = state.foot.l;
    hlenOut.textContent = (+hlen.value).toFixed(2) + ' м';
    filOut.textContent = (+fil.value).toFixed(2) + ' м';
    walkOut.textContent = (+walk.value).toFixed(1) + ' м';
    offsetOut.textContent = (+offset.value).toFixed(2) + ' м';
    const universe = Math.abs(fl) < G.L ? 'внутри искривлённой зоны' : (fl > 0 ? 'вселенная A' : 'вселенная B');
    where.textContent = `l = ${fl >= 0 ? '+' : '−'}${Math.abs(fl).toFixed(2)} м · ${universe}`;
    orbit.textContent = G.h >= G.F
      ? `цилиндр горла ${(2 * G.Lc).toFixed(1)} м · скругление ${G.F.toFixed(2)} м`
      : `h < скругления: излом в середине, повторов нет`;
    dirty = true;
  }

  function resize() {
    const q = +quality.value, dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr * q)), h = Math.max(1, Math.round(canvas.clientHeight * dpr * q));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; dirty = true; }
  }

  function draw() {
    resize();
    const { l, n, frame } = state;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const fwd = [sy * cp, sp, -cy * cp], rgt = [cy, 0, sy];
    const up = [rgt[1] * fwd[2] - rgt[2] * fwd[1], rgt[2] * fwd[0] - rgt[0] * fwd[2], rgt[0] * fwd[1] - rgt[1] * fwd[0]];
    const comb = c => [0, 1, 2, 3].map(j => c[0] * frame[0][j] + c[1] * frame[1][j] + c[2] * frame[2][j]);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const tanY = Math.tan(0.5 * (canvas.width > canvas.height ? 75 : 95) * Math.PI / 180);
    gl.uniform2f(U('uTan'), tanY * canvas.width / canvas.height, tanY);
    gl.uniform2f(U('uSize'), canvas.width, canvas.height);
    gl.uniform1f(U('uL0'), l); gl.uniform3f(U('uN0'), n[0], n[1], n[2]);
    gl.uniform4fv(U('uF'), comb(fwd)); gl.uniform4fv(U('uRt'), comb(rgt)); gl.uniform4fv(U('uUp'), comb(up));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    dirty = false;
  }

  let benchUntil = 0, benchFrames = 0, benchStart = 0;
  benchBtn.addEventListener('click', () => {
    benchStart = performance.now(); benchUntil = benchStart + 3000; benchFrames = 0;
    bench.hidden = false; bench.textContent = 'замер…';
  });
  function frame(t) {
    if (benchUntil) {
      dirty = true;
      if (t > benchUntil) {
        const fps = benchFrames / ((t - benchStart) / 1000);
        const mrays = fps * canvas.width * canvas.height / 1e6;
        bench.textContent = `${fps.toFixed(0)} к/с · ${mrays.toFixed(0)} млн лучей/с (Frame в VR: ~300–430)`;
        benchUntil = 0;
      } else benchFrames++;
    }
    if (playing) {
      const dt = last ? Math.min((t - last) / 1000, 0.1) : 0;
      let v = +walk.value + 1.4 * dt;
      if (v >= +walk.max) { v = +walk.max; setPlaying(false); }
      walk.value = v; updateState();
    }
    last = t;
    if (dirty) draw();
    requestAnimationFrame(frame);
  }
  function setPlaying(p) { playing = p; last = 0; play.textContent = p ? 'Пауза' : 'Идти'; }

  walk.addEventListener('input', () => { setPlaying(false); updateState(); });
  offset.addEventListener('input', updateState);
  hlen.addEventListener('input', updateState);
  fil.addEventListener('input', updateState);
  quality.addEventListener('change', () => { dirty = true; });
  play.addEventListener('click', () => { if (+walk.value >= +walk.max) walk.value = 0; setPlaying(!playing); updateState(); });
  document.getElementById('reset').addEventListener('click', () => { setPlaying(false); walk.value = 0; yaw = 0; pitch = -0.05; updateState(); });
  window.addEventListener('resize', () => { dirty = true; });

  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, yaw, pitch }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const k = 2.2 / Math.max(canvas.clientHeight, 1);
    yaw = drag.yaw - (e.clientX - drag.x) * k;
    pitch = Math.max(-1.4, Math.min(1.4, drag.pitch + (e.clientY - drag.y) * k));
    dirty = true;
  });
  const endDrag = () => { drag = null; };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') { yaw += 0.08; dirty = true; }
    if (e.key === 'ArrowRight') { yaw -= 0.08; dirty = true; }
    if (e.key === 'ArrowUp') { walk.value = Math.min(+walk.max, +walk.value + 0.25); updateState(); }
    if (e.key === 'ArrowDown') { walk.value = Math.max(0, +walk.value - 0.25); updateState(); }
  });

  updateState();
  requestAnimationFrame(frame);
})();
</script>
